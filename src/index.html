<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="static/img/icon.svg" type="image/x-icon">
    <link rel="stylesheet" href="static/css/colors.css">
    <link rel="stylesheet" href="static/css/styles.css">
    <link rel="stylesheet" href="static/css/titlebar.css">
    <link rel="stylesheet" href="static/css/context-menu.css">
    <title>Noct</title>
</head>
<body>
    <div class="titlebar drag y-center">
        <button class="browser-btn ripple"></button>
        <div class="tabs-list">
            <button class="tab-btn ripple" data-tab="1">Tab</button>
            <button class="add-tab-btn ripple">+</button>
            <button class="bookmark-btn ripple">Bookmark</button>
        </div>
        <div class="window-ctrl-btns windows center">
            <button id="minimize" title="Minimize">—</button>
            <button id="restore" title="Restore">▢</button>
            <button id="close" title="Close">╳</button>
        </div>
    </div>
    <nav>
        <button id="back-btn" class="ripple"></button>
        <button id="forward-btn" class="ripple"></button>
        <button id="refresh-btn" class="ripple"></button>
        <div class="searchbox y-center ripple">
            <input type="text" placeholder="URL">
        </div>
        <button id="settings-btn" class="ripple">:</button>
    </nav>
    <div class="settings">
        <button>New</button>
        <button>New tab</button>
        <button>New window</button>
        <button id="incognito-btn">Incognito</button>
        <hr>
        <button>History</button>
        <button>Downloads</button>
        <button>Bookmarks</button>
        <button>Extensions</button>
        <hr>
        <button>Privacy</button>
        <button>Disable trackers</button>
        <button id="toggle-js-btn">Toggle JS</button>
        <hr>
        <button>Memory</button>
        <button id="clear-ls-btn">Clear local storage</button>
        <button id="clear-cookies-btn">Clear cookies</button>
        <button>Viewing device</button>
        <hr>
        <button>Help</button>
        <button>Settings</button>
        <button>Exit</button>
    </div>
    
    <main>
        <webview id="webview" src="https://www.google.com" useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36" partition="persist:guest" preload="browser/view/preload.js"></webview>
    </main>

    <script src="static/js/libs/ently.js"></script>
    <script src="static/js/libs/ripple.js"></script>
    <script type="module" src="browser/default/render.js"></script>
    <script type="module" src="static/js/data.js"></script>
    <script type="module" src="static/js/tabs.js"></script>
    <script type="module" src="static/js/menu.js"></script>
    <!--<script src="static/js/titlebar.js"></script>-->
</body>
</html>
